name: Validate calibration v5

on:
  push:
    branches:
      - work/final-hardening-v4
      - work/post-merge-hardening-v5
      - main
    paths:
      - 'calibracion/resultados_v5/**'
      - 'calibracion/validar_resultados_v5.py'
      - 'evaluador-web/**'
      - 'docs/**'
      - '.github/workflows/validate-v5.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate V5 JSON, scoring and repeatability
        run: python calibracion/validar_resultados_v5.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate browser and API syntax
        working-directory: evaluador-web
        run: |
          node --check public/app.js
          node --check public/official-ai-adapter.mjs
          node --check public/feedback.js
          node --check public/results-ui.js
          node --check public/integrity.mjs
          node --check public/integrity-runtime.js
          node --check api/evaluate.mjs
          node --check api/evaluate-with-usage.mjs
          node --check api/evaluate-one-shot-core.mjs
      - name: Validate one-shot official AI safeguards
        working-directory: evaluador-web
        run: |
          grep -q "GEMINI_API_KEY" api/evaluate-one-shot-core.mjs
          grep -q "gemini-3.5-flash" api/evaluate-one-shot-core.mjs
          grep -q "llamadas_modelo: 1" api/evaluate-one-shot-core.mjs
          grep -q "FREEZE_V5" api/evaluate-one-shot-core.mjs
          grep -q "GitHub no devolvió un SHA válido" api/evaluate-one-shot-core.mjs
          grep -q "costo_estimado_usd: 0" api/evaluate-one-shot-core.mjs
          grep -q "STRICT_EVIDENCE_POLICY" api/evaluate-with-usage.mjs
          grep -q "SC-02" api/evaluate-with-usage.mjs
          grep -q "AE-01" api/evaluate-with-usage.mjs
          grep -q "evaluate-one-shot-core.mjs" api/evaluate-with-usage.mjs
          grep -q "Agente IA V5" public/official-ai-adapter.mjs
          grep -q "No hace falta indicar rama ni ruta" public/official-ai-adapter.mjs
      - name: Install local runner
        working-directory: evaluador-web
        run: npm install
      - name: Build Vercel package
        working-directory: evaluador-web
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/official-ai-adapter.mjs
          test -f dist/engine_v4.mjs
          grep -q "from '/official-ai-adapter.mjs'" dist/app.js
          grep -q "kind:'github'" dist/app.js
          grep -q "Agente IA V5" dist/official-ai-adapter.mjs
      - name: Test executable runner against V5 fixtures
        working-directory: evaluador-web
        run: npm test
      - name: Test integrity controls
        working-directory: evaluador-web
        run: npm run test:integrity
      - name: Test runner against real alternate repository structure
        working-directory: evaluador-web
        run: npm run test:generalizacion
      - name: Test runner against second real repository structure
        working-directory: evaluador-web
        run: npm run test:generalizacion2
      - name: Compare deterministic runner with V5 contract on external repository
        working-directory: evaluador-web
        run: node verificar-motor-vs-contrato.mjs
